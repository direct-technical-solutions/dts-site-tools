# Runs on each pull request, weekly and by its button: the tools' self-check
# (tests/tools/check-tools.sh): their own tests, ShellCheck, the PHP and TypeScript checks of the
# tools' code, and the security audits of their locked packages. main is protected: its pull
# requests must pass this check and be up to date with main first, so the merged code is the code
# just tested. The tools are proven on a real dev site by the sites that use them, not here: this
# repository has no site to build one from.
name: check

on:
  pull_request:
  # Weekly, so the security audits catch advisories published for packages already in use,
  # even when no code changes (Mondays 06:17 UTC; an off-minute avoids the busy hour mark).
  schedule:
    - cron: "17 6 * * 1"
  # The "Run workflow" button: the check on demand.
  workflow_dispatch:

# Read-only access to the repository is all the check needs.
permissions:
  contents: read

# A newer push to a pull request makes its older run pointless. Runs on main (the weekly run and
# the button) are not cancelled, so each one reports in full.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned by commit, not by tag: a tag can be moved to different code, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check never pushes; the token is not kept on the runner.
          persist-credentials: false

      - name: The tools' self-check
        run: tests/tools/check-tools.sh
